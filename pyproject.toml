[project]
name = "kisan"
version = "0.1.0"
description = "Agricultural chatbot for Indian farmers"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Web Framework
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "python-multipart>=0.0.6",

    # Data Validation
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",

    # LLM & Embeddings
    "openai>=1.10.0",

    # Vector Database
    "qdrant-client>=1.7.0",

    # PDF Processing
    "pymupdf>=1.23.0",
    "docling>=2.0.0",
    "tiktoken>=0.7.0",

    # HTTP Client
    "httpx>=0.26.0",

    # Logging
    "loguru>=0.7.2",

    # UI
    "streamlit>=1.30.0",

    # Utilities
    "python-dotenv>=1.0.0",
    "tenacity>=8.2.0",
    "pillow>=10.0.0",

    # Database & Scheduling
    "asyncpg>=0.29.0",
    "apscheduler>=3.10.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4.0", "pytest-asyncio>=0.23.0", "ruff>=0.1.0"]
eval = ["deepeval>=0.21.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kisan"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "eval: marks tests as evaluation tests (deselect with '-m \"not eval\"')",
]
filterwarnings = [
    "ignore::DeprecationWarning:importlib._bootstrap",
]