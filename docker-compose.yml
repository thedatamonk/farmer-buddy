services:
  postgres:
    image: postgres:16-alpine
    container_name: kisan-postgres
    environment:
      POSTGRES_USER: kisan
      POSTGRES_PASSWORD: kisan123
      POSTGRES_DB: kisan
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kisan -d kisan"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
